<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Core Capabilities">
  <!-- Section header drawn as a selected Project node card with link handle -->
  <style>
    .card{fill:#1D1B20;stroke:#D0BCFF;stroke-width:2}.kind{font:600 13px ui-monospace,monospace;letter-spacing:.14em;fill:#D0BCFF}
    .h{font:800 34px system-ui,'Segoe UI',sans-serif;fill:#F4F0F5;letter-spacing:-.02em}
    .sub{font:400 16px system-ui,sans-serif;fill:#938F99}.handle{fill:#D0BCFF}.sq{fill:#D0BCFF}
    @keyframes breathe{0%,100%{r:5}50%{r:7}}.handle{animation:breathe 2.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.handle{animation:none}}
    @media (prefers-color-scheme:light){.card{fill:#fff;stroke:#6650A4}.kind{fill:#6650A4}.sq{fill:#6650A4}.h{fill:#1D1B20}.sub{fill:#625B71}.handle{fill:#6650A4}}
  </style>
  <rect class="card" x="2" y="6" width="560" height="84" rx="18"/>
  <rect class="sq" x="24" y="24" width="12" height="12" rx="3.5"/><text class="kind" x="46" y="36">PROJECT · SECTION 2</text>
  <text class="h" x="24" y="76">Core Capabilities</text>
  <circle class="handle" cx="562" cy="48" r="5"/>
  <text class="sub" x="590" y="54">Physics graph, reactive AI drafting, and native multiplatform speed.</text>
</svg>
