<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <!-- A command-line rule: a prompt marker, a hairline, and a blinking caret at the end. -->
  <style>
    .p{font:700 15px ui-monospace,monospace;fill:#D0BCFF}.r{stroke:#2B2930;stroke-width:1.5;stroke-dasharray:2 6}.c{fill:#D0BCFF}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.c{animation:blink 1.1s steps(1) infinite}
    @media (prefers-reduced-motion:reduce){.c{animation:none}}
    @media (prefers-color-scheme:light){.p,.c{fill:#6650A4}.r{stroke:#D6CEE0}}
  </style>
  <text class="p" x="0" y="17">›</text>
  <line class="r" x1="22" y1="12" x2="1176" y2="12"/>
  <rect class="c" x="1184" y="3" width="9" height="18" rx="2"/>
</svg>
