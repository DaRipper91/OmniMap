<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation">
  <!-- A link between two nodes; a pulse travels along it like an edge being drawn. -->
  <style>
    .line{stroke:#2B2930;stroke-width:2}.pulse{stroke:#D0BCFF;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:90 1200}
    .ring{fill:none;stroke:#9ECAFF;stroke-width:2.5}.b{fill:#D0BCFF}
    @keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:-1110}}
    .pulse{animation:run 3.6s cubic-bezier(.5,0,.3,1) infinite}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
    @media (prefers-color-scheme:light){.line{stroke:#E4DCEC}.pulse{stroke:#6650A4}.ring{stroke:#0B5FAE}.b{fill:#6650A4}}
  </style>
  <circle class="ring" cx="14" cy="14" r="5"/>
  <line class="line" x1="26" y1="14" x2="1172" y2="14"/>
  <line class="pulse" x1="26" y1="14" x2="1172" y2="14"/>
  <rect class="b" x="1178" y="8" width="12" height="12" rx="3.5"/>
</svg>
