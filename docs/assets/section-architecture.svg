<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Architecture and Invariants">
  <!-- Atlas cartouche style header for architecture section -->
  <style>
    .box{fill:#1D1B20;stroke:#49454F;stroke-width:1}.box2{fill:none;stroke:#D0BCFF;stroke-width:2}
    .plate{font:600 12px ui-monospace,monospace;fill:#EFB8C8;letter-spacing:.24em}
    .h{font:800 32px system-ui,'Segoe UI',sans-serif;fill:#F4F0F5;letter-spacing:-.01em}
    .sub{font:italic 16px 'Iowan Old Style',Palatino,Georgia,serif;fill:#938F99}.orn{fill:#D0BCFF}
    @media (prefers-color-scheme:light){.box{fill:#fff;stroke:#B9B1C4}.box2{stroke:#6650A4}.plate{fill:#7D5260}.h{fill:#1D1B20}.sub{fill:#625B71}.orn{fill:#6650A4}}
  </style>
  <rect class="box" x="2" y="6" width="580" height="84" rx="14"/>
  <rect class="box2" x="8" y="12" width="568" height="72" rx="10"/>
  <path class="orn" d="M28,24 l5,5 l-5,5 l-5,-5 z"/>
  <text class="plate" x="42" y="32">PLATE IV · INVARIANTS</text>
  <text class="h" x="24" y="68">System Architecture</text>
  <text class="sub" x="610" y="54">Local-first Kotlin Multiplatform, Room FTS4, and clean state flows.</text>
</svg>
