<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="How it works">
  <!-- A section heading drawn as a selected node card, with its link handle. -->
  <style>
    .card{fill:#1D1B20;stroke:#D0BCFF;stroke-width:2}.kind{font:600 13px ui-monospace,monospace;letter-spacing:.14em;fill:#9ECAFF}
    .h{font:800 34px system-ui,'Segoe UI',sans-serif;fill:#F4F0F5;letter-spacing:-.02em}
    .sub{font:400 16px system-ui,sans-serif;fill:#938F99}.handle{fill:#D0BCFF}.ring{fill:none;stroke:#9ECAFF;stroke-width:3}
    @keyframes breathe{0%,100%{r:5}50%{r:7}}.handle{animation:breathe 2.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.handle{animation:none}}
    @media (prefers-color-scheme:light){.card{fill:#fff;stroke:#6650A4}.kind{fill:#0B5FAE}.ring{stroke:#0B5FAE}.h{fill:#1D1B20}.sub{fill:#625B71}.handle{fill:#6650A4}}
  </style>
  <rect class="card" x="2" y="6" width="560" height="84" rx="18"/>
  <circle class="ring" cx="30" cy="31" r="6"/><text class="kind" x="46" y="36">GOAL · SECTION 3</text>
  <text class="h" x="24" y="76">How it works</text>
  <circle class="handle" cx="562" cy="48" r="5"/>
  <text class="sub" x="590" y="54">From a prompt to committed nodes in four steps.</text>
</svg>
