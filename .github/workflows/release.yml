name: Build and Release OmniMap

on:
  push:
    branches:
      - main
  # Build-only on PRs (no release: create-release is limited to main).
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its older, now-outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Grant Execute Permissions for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      matrix:
        include:
          # x86_64 Linux: .deb (Debian/Ubuntu), .rpm (Fedora) and a tarball (Arch/CachyOS, any distro)
          - os: ubuntu-latest
            task: packageDeb packageRpm packageLinuxTarball
            artifact: linux-x86_64
            path: |
              desktop/build/compose/binaries/main/deb/*.deb
              desktop/build/compose/binaries/main/rpm/*.rpm
              desktop/build/compose/binaries/main/tarball/*.tar.gz
          # aarch64 Linux (Asahi on Apple Silicon, ARM laptops). jpackage only builds
          # for the CPU it runs on, so this needs an ARM runner.
          - os: ubuntu-24.04-arm
            task: packageRpm packageLinuxTarball
            artifact: linux-aarch64
            path: |
              desktop/build/compose/binaries/main/rpm/*.rpm
              desktop/build/compose/binaries/main/tarball/*.tar.gz
          - os: windows-latest
            task: packageMsi
            artifact: windows-msi
            path: "desktop/build/compose/binaries/main/msi/*.msi"
          - os: macos-latest
            task: packageDmg
            artifact: macos-dmg
            path: "desktop/build/compose/binaries/main/dmg/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Grant Execute Permissions for gradlew
        run: chmod +x gradlew

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Desktop Package
        shell: bash
        run: |
          tasks=""
          for t in ${{ matrix.task }}; do tasks="$tasks :desktop:$t"; done
          ./gradlew $tasks --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get Version Name
        id: version
        run: |
          VERSION=$(grep "versionName =" androidApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-b${{ github.run_number }}
          name: OmniMap v${{ env.VERSION }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            artifacts/android-apk/*.apk
            artifacts/linux-x86_64/**/*.deb
            artifacts/linux-x86_64/**/*.rpm
            artifacts/linux-x86_64/**/*.tar.gz
            artifacts/linux-aarch64/**/*.rpm
            artifacts/linux-aarch64/**/*.tar.gz
            artifacts/windows-msi/*.msi
            artifacts/macos-dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
